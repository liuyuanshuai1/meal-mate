{% extends "admin/base.html" %}

{% block content %}
<form class="form-panel mb-4" method="get" action="/admin/eat-records">
  <div class="row g-3 align-items-end">
    <div class="col-sm-4">
      <label class="form-label">用户 ID</label>
      <input class="form-control" name="user_id" value="{{ user_id }}">
    </div>
    <div class="col-sm-3">
      <button class="btn btn-primary" type="submit">查询</button>
    </div>
  </div>
</form>
<div class="table-panel">
  <table class="table table-hover align-middle">
    <thead><tr><th>记录 ID</th><th>用户 ID</th><th>人物标识</th><th>总价</th><th>吃饭时间</th><th>菜品数量</th><th>创建时间</th><th>操作</th></tr></thead>
    <tbody>
      {% for record in records %}
      <tr>
        <td>{{ record.id }}</td>
        <td>{{ record.user_id }}</td>
        <td>{{ record.person }}</td>
        <td>{{ record.total_price }}</td>
        <td>{{ record.eaten_at }}</td>
        <td>{{ record.items|length }}</td>
        <td>{{ record.created_at }}</td>
        <td class="d-flex gap-2">
          <a class="btn btn-sm btn-outline-primary" href="/admin/eat-records/{{ record.id }}?user_id={{ user_id }}">详情</a>
          <form method="post" action="/admin/eat-records/{{ record.id }}/delete" data-confirm="确认删除这条记录？">
            <input type="hidden" name="user_id" value="{{ user_id }}">
            <button class="btn btn-sm btn-outline-danger" type="submit">删除</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
