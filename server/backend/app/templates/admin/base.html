<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} - 一起吃饭叭后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: #f7f7f8; }
      .admin-shell { max-width: 1180px; }
      .table img { width: 72px; height: 48px; object-fit: cover; border-radius: 6px; background: #eee; }
      .form-panel { background: #fff; border: 1px solid #e6e6e8; border-radius: 8px; padding: 20px; }
      .table-panel { background: #fff; border: 1px solid #e6e6e8; border-radius: 8px; padding: 16px; }
      .muted { color: #6c757d; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container admin-shell">
        <a class="navbar-brand" href="/admin">一起吃饭叭后台</a>
        <div class="navbar-nav">
          <a class="nav-link {% if active_nav == 'index' %}active{% endif %}" href="/admin">后台首页</a>
          <a class="nav-link {% if active_nav == 'categories' %}active{% endif %}" href="/admin/categories">菜品分类</a>
          <a class="nav-link {% if active_nav == 'foods' %}active{% endif %}" href="/admin/foods">菜品</a>
          <a class="nav-link {% if active_nav == 'banners' %}active{% endif %}" href="/admin/banners">Banner</a>
          <a class="nav-link {% if active_nav == 'eat_records' %}active{% endif %}" href="/admin/eat-records">一起吃过记录</a>
        </div>
      </div>
    </nav>
    <main class="container admin-shell py-4">
      <h1 class="h3 mb-3">{{ title }}</h1>
      {% if message %}
        <div class="alert alert-success">{{ message }}</div>
      {% endif %}
      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <script>
      document.querySelectorAll('[data-confirm]').forEach((form) => {
        form.addEventListener('submit', (event) => {
          if (!window.confirm(form.dataset.confirm || '确认删除？')) {
            event.preventDefault();
          }
        });
      });
    </script>
  </body>
</html>
