[project]
name = "meal-mate-backend"
version = "0.1.0"
description = "MealMate FastAPI backend service"
readme = "backend/README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "greenlet",
    "httpx",
    "jinja2",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "aiosqlite",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
plugins = ["sqlalchemy.ext.mypy.plugin"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
