services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-meal_mate}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meal_mate"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "${DEBUG:-false}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/meal_mate}"
      UPLOAD_DIR: "${UPLOAD_DIR:-/app/static/uploads}"
      PUBLIC_STATIC_URL: "${PUBLIC_STATIC_URL:-/static/uploads}"
      TZ: "${TZ:-Asia/Shanghai}"
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET:-}"
      WECHAT_DINNER_PLAN_TEMPLATE_ID: "${WECHAT_DINNER_PLAN_TEMPLATE_ID:-}"
      WECHAT_DINNER_PLAN_TEMPLATE_FIELDS: "${WECHAT_DINNER_PLAN_TEMPLATE_FIELDS:-}"
      TOKEN_SECRET: "${TOKEN_SECRET:-change-me-in-production}"
      TOKEN_TTL_DAYS: "${TOKEN_TTL_DAYS:-30}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      WECHAT_MOCK_LOGIN: "${WECHAT_MOCK_LOGIN:-false}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-flash}"
      AI_EXPLORE_DAILY_LIMIT: "${AI_EXPLORE_DAILY_LIMIT:-20}"
    volumes:
      - uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/static/uploads:ro
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
